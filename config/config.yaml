# =============================================================================
# Paper Filter Configuration
# =============================================================================

# --- Core interest profile (Zotero library) ---
zotero_export: "config/MyLibrary.txt"

# --- Exploration profile ---
exploration_description: |
  I am curious about learning across multiple timescales — from trial-by-trial adaptation
  and curriculum-driven skill acquisition, to the gradual emergence of structured knowledge
  and cognitive flexibility over development, from infancy through childhood to adulthood
  and ageing in humans and non-human animals. I am interested in naturalistic neuroscience
  — how neural circuits support complex behaviour in unconstrained, real-world settings
  rather than simplified laboratory tasks, and what new computational frameworks are needed
  to analyse such data. I find the relationship between representational geometries in
  neural data and those in large-scale AI models interesting, and what this comparative
  approach reveals about computational principles shared between brains and machines.
  Finally, I am interested in the neural basis of social cognition and multi-agent
  behaviour, including how the brain models others' intentions and coordinates action
  in interactive settings.

# --- Thresholds ---
core_threshold: 0.30       # papers closely matching your Zotero profile
explore_threshold: 0.18    # adjacent/surprising papers
top_n: 5                   # min papers per feed per source (applied to all outputs)

# --- Feeds ---
#
# KEEP IN INOREADER DIRECTLY (already topic-specific, low volume):
#   - Nature Neuroscience:          https://www.nature.com/neuro.rss
#   - Nature Reviews Neuroscience:  https://www.nature.com/nrn.rss
#   - Neuron:                       https://www.cell.com/neuron/inpress.rss
#   - Cell:                         https://www.cell.com/cell/inpress.rss
#   - Trends in Cognitive Sciences: https://www.cell.com/cognitive-sciences/inpress.rss
#   - Trends in Neurosciences:      https://www.cell.com/neurosciences/inpress.rss
#   - Annual Reviews Neuroscience:  https://www.annualreviews.org/rss/content/journals/neuro/latestarticles?fmt=rss
#   - Annual Reviews Psychology:    https://www.annualreviews.org/rss/content/journals/psych/latestarticles?fmt=rss
#   - Psychological Bulletin:       https://psycnet.apa.org/journals/bul.rss

# Preprint feeds — semantically filtered → preprint output feed
preprint_feeds:
  - name: "arXiv AI"
    url: "https://rss.arxiv.org/rss/cs.AI"
  - name: "arXiv Machine Learning"
    url: "https://rss.arxiv.org/rss/cs.LG"
  - name: "arXiv Computation and Language"
    url: "https://rss.arxiv.org/rss/cs.CL"
  - name: "arXiv Neurons and Cognition"
    url: "https://rss.arxiv.org/rss/q-bio.NC"
  - name: "bioRxiv Neuroscience"
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=neuroscience"
  - name: "bioRxiv Psychology"
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=psychology"
  - name: "bioRxiv Animal Behavior and Cognition"
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=animal-behavior-and-cognition"
  - name: "medRxiv Psychiatry and Clinical Psychology"
    url: "https://connect.medrxiv.org/medrxiv_xml.php?subject=psychiatry-and-clinical-psychology"
  - name: "PsyArXiv"
    url: "https://psyarxiv.com/feed/"
  - name: "SocArXiv"
    url: "https://share.osf.io/api/v2/feeds/atom/?filter[sources]=socarxiv"

# Journal feeds — semantically filtered → journal output feed
journal_feeds:
