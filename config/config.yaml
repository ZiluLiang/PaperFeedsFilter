# =============================================================================
# Paper Filter Configuration
# =============================================================================

# --- Core interest profile (Zotero library) ---
zotero_export: "config/MyLibrary.txt"

# --- Exploration profile ---
# Optional. If left empty, Claude will automatically infer adjacent interests
# from your Zotero library and save the result to config/exploration_description.txt
# (delete that file to regenerate it).
# If you want to override, write your own description here.
exploration_description: ""

# --- Thresholds ---
core_threshold: 0.30       # higher — only papers closely matching your Zotero profile
explore_threshold: 0.18    # lower — catches adjacent/surprising papers
top_n: 5                   # min papers per feed per output (applied to both)

# --- Feeds ---
# core_feeds: filtered against your Zotero profile → core feed
# explore_feeds: filtered against exploration profile → explore feed
# A feed can appear in both if you want.
#
# KEEP IN INOREADER DIRECTLY (already topic-specific, low volume):
#   - Nature Neuroscience:         https://www.nature.com/neuro.rss
#   - Nature Reviews Neuroscience: https://www.nature.com/nrn.rss
#   - Neuron:                      https://www.cell.com/neuron/inpress.rss
#   - Cell:                        https://www.cell.com/cell/inpress.rss
#   - Trends in Cognitive Sciences: https://www.cell.com/cognitive-sciences/inpress.rss
#   - Trends in Neurosciences:     https://www.cell.com/neurosciences/inpress.rss
#   - Annual Reviews Neuroscience: https://www.annualreviews.org/rss/content/journals/neuro/latestarticles?fmt=rss
#   - Annual Reviews Psychology:   https://www.annualreviews.org/rss/content/journals/psych/latestarticles?fmt=rss
#   - Psychological Bulletin:      https://psycnet.apa.org/journals/bul.rss

core_feeds:
  # Preprints
  - name: "arXiv AI"
    url: "https://rss.arxiv.org/rss/cs.AI"
  - name: "arXiv Machine Learning"
    url: "https://rss.arxiv.org/rss/cs.LG"
  - name: "arXiv Computation and Language"
    url: "https://rss.arxiv.org/rss/cs.CL"
  - name: "arXiv Neurons and Cognition"
    url: "https://rss.arxiv.org/rss/q-bio.NC"
  - name: "bioRxiv Neuroscience"
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=neuroscience"
  - name: "bioRxiv Psychology"
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=psychology"
  - name: "PsyArXiv"
    url: "https://psyarxiv.com/feed/"
  # Broad journals
  - name: "Nature"
    url: "https://www.nature.com/nature.rss"
  - name: "Science"
    url: "https://feeds.science.org/rss/science-aop.xml"
  - name: "PNAS"
    url: "https://www.pnas.org/rss/current.xml"
  - name: "Current Biology"
    url: "https://www.cell.com/current-biology/inpress.rss"
  - name: "Science Advances"
    url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=sciadv"
  - name: "Nature Human Behaviour"
    url: "https://www.nature.com/nathumbehav.rss"
  - name: "eLife"
    url: "https://elifesciences.org/rss/recent.xml"

explore_feeds:
  # Adjacent preprint categories not in core
  - name: "arXiv Computer Vision"
    url: "https://rss.arxiv.org/rss/cs.CV"
  - name: "arXiv Economics"
    url: "https://rss.arxiv.org/rss/econ.GN"
  - name: "arXiv Physics & Society"
    url: "https://rss.arxiv.org/rss/physics.soc-ph"
  - name: "arXiv Quantitative Biology"
    url: "https://rss.arxiv.org/rss/q-bio.PE"
  - name: "bioRxiv Animal Behavior"
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=animal-behavior-and-cognition"
  # Broad journals also scanned for surprises
  - name: "Nature"
    url: "https://www.nature.com/nature.rss"
  - name: "Science"
    url: "https://feeds.science.org/rss/science-aop.xml"
  - name: "PNAS"
    url: "https://www.pnas.org/rss/current.xml"

# --- Output ---
output:
  core_filename: "filtered_feed.xml"
  explore_filename: "explore_feed.xml"
  core_title: "Zilu's Core Paper Feed"
  explore_title: "Zilu's Explore Feed"
  core_description: "Papers closely matching your Zotero research profile"
  explore_description: "Adjacent and surprising papers outside your usual domain"
  max_age_days: 7
