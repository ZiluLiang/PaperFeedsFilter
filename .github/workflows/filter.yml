name: Filter Papers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sentence-transformers-all-MiniLM-L6-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run filter
        run: python scripts/filter.py --config config/config.yaml

      - name: Verify output
        run: |
          echo "=== Output files ==="
          ls -lh preprint_feed.xml journal_feed.xml explore_feed.xml feed_summary.json
          echo "=== Summary ==="
          cat feed_summary.json

      - name: Push feeds to gh-pages
        run: |
          cp preprint_feed.xml /tmp/preprint_feed.xml
          cp journal_feed.xml /tmp/journal_feed.xml
          cp explore_feed.xml /tmp/explore_feed.xml
          cp feed_summary.json /tmp/feed_summary.json
          rm preprint_feed.xml journal_feed.xml explore_feed.xml feed_summary.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git checkout gh-pages

          cp /tmp/preprint_feed.xml preprint_feed.xml
          cp /tmp/journal_feed.xml journal_feed.xml
          cp /tmp/explore_feed.xml explore_feed.xml
          cp /tmp/feed_summary.json feed_summary.json

          git add -f preprint_feed.xml journal_feed.xml explore_feed.xml feed_summary.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Update feeds $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin gh-pages
