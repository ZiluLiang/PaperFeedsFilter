name: Filter Papers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sentence-transformers-all-MiniLM-L6-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run filter
        run: python scripts/filter.py --config config/config.yaml

      - name: Verify output
        run: |
          echo "=== Output files ==="
          ls -lh filtered_feed.xml filtered_feed_summary.json
          echo "=== Feed preview ==="
          head -30 filtered_feed.xml

      - name: Push feed to gh-pages
        run: |
          # Save generated files
          cp filtered_feed.xml /tmp/filtered_feed.xml
          cp filtered_feed_summary.json /tmp/filtered_feed_summary.json

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to gh-pages
          git fetch origin gh-pages
          git checkout gh-pages

          # Copy files in
          cp /tmp/filtered_feed.xml filtered_feed.xml
          cp /tmp/filtered_feed_summary.json filtered_feed_summary.json

          # Commit and push
          git add -f filtered_feed.xml filtered_feed_summary.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Update feed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin gh-pages
